name: Deploy Backend to VPS

on:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'contracts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - '.env.example'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.156.208.51
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            su - hermes -c 'cd /home/hermes/Projects/Backend-Lembar &&
              git fetch origin dev &&
              git checkout -B dev ${{ github.sha }} &&
              pnpm install --frozen-lockfile &&
              pnpm run build &&
              pm2 restart lembar-api lembar-worker --update-env'
            curl --fail --silent --show-error http://127.0.0.1:4000/health >/dev/null
