name: Deploy Backend to VPS

# Two jobs:
#   gate   — runs the full AGENTS.md quality gate on the pushed commit.
#   deploy — build + pm2 restart, and it `needs: gate`, so a red gate blocks
#            the production deploy entirely.
#
# Why the gate lives here rather than in a separate workflow: GitHub Actions
# `needs:` only reaches jobs inside the same workflow, and the requirement is
# that a failing gate blocks *this* deploy. A separate workflow could run in
# parallel and finish after the deploy had already shipped.
#
# Runner requirement (self-hosted): the `gate` job needs `docker` (for
# `pnpm test:db` against compose.test.yaml's ephemeral Postgres on
# 127.0.0.1:55432), `pnpm`, and a Node 22 toolchain on the runner's PATH. If
# the runner loses docker, `test:db` fails and the deploy is blocked — which
# is the intended fail-closed direction.
#
# Triggered on push to dev. The deploy body runs through `sudo -u hermes -H`
# because the self-hosted runner executes as root with no HOME in its
# environment: git then cannot read /root/.gitconfig, rejects the hermes-owned
# checkout as "dubious ownership" (exit 128), has no ssh key for the origin
# remote, and pm2 would attach to root's daemon instead of the one serving
# api.lembar.web.id. See Frontend-Lembar commit 7337ecf for the same fix. The
# `gate` job needs none of that (it runs in the runner's own workspace), but it
# is pinned to the same self-hosted label.

on:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'contracts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'eslint.config.mjs'
      - '.prettierrc.json'
      - '.prettierignore'
      - 'compose.test.yaml'
      - '.env.example'
      - '.github/workflows/deploy-backend.yml'

concurrency:
  group: deploy-backend-dev
  cancel-in-progress: false

jobs:
  gate:
    name: Quality gate
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # The runner executes as root with no HOME and without node/pnpm on its
      # PATH (both live in /home/hermes/.local/bin), so the gate runs as the
      # hermes user — the same pattern the deploy job uses below. That gives the
      # gate hermes' toolchain, pnpm store, and docker group membership (needed
      # by `pnpm test:db`). The checkout is chowned to hermes first because the
      # runner workspace is root-owned.
      - name: Run quality gate
        run: |
          set -eu
          WORKSPACE="$PWD"
          chown -R hermes:hermes "$WORKSPACE"
          sudo -u hermes -H env WORKSPACE="$WORKSPACE" bash -lc '
            set -eu
            cd "$WORKSPACE"
            export PATH="$HOME/.local/bin:$PATH"
            node --version
            pnpm --version
            git rev-parse HEAD
            docker --version
            pnpm gate
          '

  deploy:
    name: Deploy to VPS
    needs: gate
    runs-on: self-hosted
    steps:
      - name: Deploy verified commit
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -eu
          sudo -u hermes -H env TARGET_SHA="${TARGET_SHA}" bash -lc '
            set -eu
            cd /home/hermes/Projects/Backend-Lembar
            git fetch origin dev
            # The primary checkout is the one pm2 serves from, so it has to move
            # to the pushed SHA. Preserve any unpushed local tip first, so a
            # deploy can never silently drop work that lives only on this host.
            if old=$(git rev-parse --verify -q dev); then
              if [ "$old" != "${TARGET_SHA}" ]; then
                git branch -f "deploy-backup/$(date -u +%Y%m%dT%H%M%SZ)" "$old" 2>/dev/null || true
              fi
            fi
            git checkout -B dev "${TARGET_SHA}"
            pnpm install --frozen-lockfile
            pnpm run build
            pm2 restart lembar-api lembar-worker --update-env
            # pm2 restart returns before the server is listening, so poll
            # instead of curl-ing once and failing on connection refused.
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:4000/health >/dev/null 2>&1; then
                echo "deployed ${TARGET_SHA} (healthy after ${attempt} attempt(s))"
                exit 0
              fi
              sleep 2
            done
            echo "app did not become healthy on :4000 after restart"
            exit 1
          '
