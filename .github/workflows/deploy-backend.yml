name: Deploy Backend to VPS

on:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'contracts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - '.env.example'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Docker services to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.156.208.51
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            cd /home/hermes/Projects/Backend-Lembar
            git -c safe.directory=/home/hermes/Projects/Backend-Lembar pull --ff-only origin dev
            docker compose up --build --detach --remove-orphans
            docker compose ps
            curl --fail --silent --show-error http://127.0.0.1:4000/health >/dev/null
