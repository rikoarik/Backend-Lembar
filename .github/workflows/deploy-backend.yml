name: Deploy Backend to VPS

on:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'contracts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - '.env.example'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy backend
        working-directory: /home/hermes/Projects/Backend-Lembar
        run: |
          set -eu
          git fetch origin dev
          git checkout -B dev ${{ github.sha }}
          pnpm install --frozen-lockfile
          pnpm run build
          pm2 restart lembar-api lembar-worker --update-env
          curl --fail --silent --show-error http://127.0.0.1:4000/health >/dev/null
