name: Quality Gate

# Pre-merge gate: runs the same `pnpm gate` sequence as the `gate` job in
# deploy-backend.yml, but on pull requests and on pushes to branches other than
# dev, so a broken tree is caught before it reaches dev instead of only when the
# deploy is already blocked.
#
# dev itself is intentionally excluded here: deploy-backend.yml's `gate` job
# already gates dev pushes, and running both would duplicate a heavy job on the
# single self-hosted runner for no extra signal.
#
# Runner requirement: same as deploy-backend.yml — self-hosted, with docker,
# pnpm and Node 22 available. No secrets, no providers, no deploy.

on:
  pull_request:
  push:
    branches-ignore: [dev]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Quality gate
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # The runner executes as root with no HOME and without node/pnpm on its
      # PATH (both live in /home/hermes/.local/bin), so the gate runs as the
      # hermes user — same pattern as the deploy job in deploy-backend.yml.
      # The checkout is chowned to hermes first because the runner workspace is
      # root-owned.
      - name: Run quality gate
        run: |
          set -eu
          WORKSPACE="$PWD"
          chown -R hermes:hermes "$WORKSPACE"
          sudo -u hermes -H env WORKSPACE="$WORKSPACE" bash -lc '
            set -eu
            cd "$WORKSPACE"
            export PATH="$HOME/.local/bin:$PATH"
            node --version
            pnpm --version
            git rev-parse HEAD
            docker --version
            pnpm gate
          '
