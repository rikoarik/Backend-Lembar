services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lembar_test
      POSTGRES_PASSWORD: lembar_test
      POSTGRES_DB: lembar_test
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lembar_test -d lembar_test']
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    labels:
      com.lembar.purpose: ephemeral-integration-tests
