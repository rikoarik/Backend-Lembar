services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on: []
  worker:
    build: .
    env_file:
      - .env
    command: ["node", "dist/bootstrap/worker.js"]
    restart: unless-stopped
