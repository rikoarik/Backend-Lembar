openapi: 3.1.0
info:
  title: lembar API
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Baseline contract for planning. The backend repository owns the executable OpenAPI
    document. This file does not authorize implementation of every path at once.
servers:
  - url: /
    description: Current API origin or configured same-origin gateway
tags:
  - name: System
    description: Health and service metadata.
  - name: Identity
    description: Current account, session, and workspace context.
  - name: Catalog
    description: Versioned curriculum, grade, subject, and material options.
  - name: Sources
    description: Private source upload and processing lifecycle.
  - name: Assessments
    description: Assessment drafts, versions, review, and finalization.
  - name: Jobs
    description: Neutral asynchronous job state.
  - name: Outputs
    description: Export artifacts and controlled sharing.
  - name: Marketing
    description: Published structured marketing content.
  - name: MarketingOps
    description: Superadmin-only marketing authoring and publication.
  - name: Notifications
    description: Transactional notification templates, dispatch, and redacted audit log.
  - name: AdminOps
    description: Superadmin-only school, account, flag, billing, and quality-report management.
  - name: AiPrompts
    description: Superadmin AI prompt lifecycle — versions, eval cases, and performance metrics.
  - name: History
    description: Tenant-scoped assessment history and private question bank.
  - name: Shares
    description: Controlled share links for assessments.
paths:
  /health:
    get:
      summary: Read service health
      tags: [System]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
  /v1/me/plan:
    get:
      summary: Read the authenticated workspace plan and trial status
      tags: [Identity]
      operationId: getMyPlan
      responses:
        "200":
          description: Effective plan, usage, and trial status
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [workspaceId, plan, trial]
                    properties:
                      workspaceId: { type: string, format: uuid }
                      plan: { type: string, enum: [free, pro] }
                      trial:
                        type: object
                        required: [claimed, active, startsAt, endsAt]
                        properties:
                          claimed: { type: boolean }
                          active: { type: boolean }
                          startsAt: { type: [string, "null"], format: date-time }
                          endsAt: { type: [string, "null"], format: date-time }
        "401":
          description: Authentication required
  /v1/me/plan/trial/claim:
    post:
      summary: Claim the authenticated workspace's one-time 60-day Pro trial
      tags: [Identity]
      operationId: claimMyPlanTrial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceToken]
              additionalProperties: false
              properties:
                deviceToken: { type: string, minLength: 1, maxLength: 512 }
      responses:
        "201":
          description: Trial claimed
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Authentication required
        "403":
          description: Superadmin is not eligible
        "409":
          description: Trial eligibility or uniqueness conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/auth/register:
    post:
      summary: Register a new user account
      tags: [Identity]
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string, minLength: 1 }
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/auth/google/url:
    get:
      summary: Get Google OAuth consent URL
      tags: [Auth]
      operationId: getGoogleOAuthUrl
      responses:
        "200":
          description: Google OAuth URL
          content:
            application/json:
              schema:
                type: object
                required: [url, state]
                properties:
                  url:
                    type: string
                    format: uri
                    description: Google OAuth consent screen URL
                  state:
                    type: string
                    description: CSRF state token
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/auth/google/callback:
    post:
      summary: Google OAuth callback - exchange code for JWT
      tags: [Auth]
      operationId: googleOAuthCallback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Authorization code from Google
                state:
                  type: string
                  description: CSRF state token
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token:
                    type: string
                    description: JWT token for subsequent requests
                  user:
                    type: object
                    required: [id, email, roles]
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                      roles:
                        type: array
                        items:
                          $ref: "#/components/schemas/UserRole"
                      workspaceId:
                        type: string
                        format: uuid
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/login:
    post:
      summary: Login with email, username, or phone and receive JWT token
      tags: [Identity]
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                identifier:
                  type: string
                  description: Email, username, or phone number
                email:
                  type: string
                  description: Backward-compatible alias of identifier (email/username/phone)
                password: { type: string }
              anyOf:
                - required: [identifier]
                - required: [email]
            examples:
              email:
                value:
                  email: user@example.com
                  password: "Test1234!@#A"
              username:
                value:
                  identifier: subscriber03
                  password: "Test1234!@#A"
              phone:
                value:
                  identifier: "081233344455"
                  password: "Test1234!@#A"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/auth/me:
    get:
      summary: Get current authenticated user info
      tags: [Identity]
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/me/roles:
    patch:
      summary: Update user roles (superadmin only)
      tags: [Identity]
      operationId: updateUserRoles
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  items: { type: string }
                  description: New roles array
      responses:
        "200":
          description: Roles updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden - superadmin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/me:
    get:
      summary: Read the current account and workspace options
      tags: [Identity]
      operationId: getCurrentAccount
      responses:
        "200":
          description: Current account and available workspaces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/dashboard/summary:
    get:
      summary: Read the active workspace dashboard summary
      tags: [Identity]
      operationId: getDashboardSummary
      responses:
        "200":
          description: Active workspace dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/catalog/curricula:
    get:
      summary: List active published curriculum versions
      tags: [Catalog]
      operationId: listCurricula
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Active published curriculum versions for assessment creation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogCurriculumVersion"
  /v1/catalog/grades:
    get:
      summary: List available grades
      tags: [Catalog]
      operationId: listGrades
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Available grades
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogOption"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/catalog/phases:
    get:
      summary: List official curriculum phases
      tags: [Catalog]
      operationId: listPhases
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - in: query
          name: gradeId
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Official phases, optionally filtered by grade
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogOption"
  /v1/catalog/subjects:
    get:
      summary: List subjects for a grade and curriculum version
      tags: [Catalog]
      operationId: listSubjects
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - in: query
          name: gradeId
          required: true
          schema: { type: string }
        - in: query
          name: curriculumVersionId
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Available subjects
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogOption"
        "400":
          $ref: "#/components/responses/ValidationError"
  /v1/catalog/materials:
    get:
      summary: List materials for the selected catalog context
      tags: [Catalog]
      operationId: listMaterials
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - in: query
          name: gradeId
          required: true
          schema: { type: string }
        - in: query
          name: subjectId
          required: true
          schema: { type: string }
        - in: query
          name: curriculumVersionId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Available materials
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogOption"
        "400":
          $ref: "#/components/responses/ValidationError"
  /v1/sources/upload-intents:
    post:
      summary: Create a private PDF upload intent
      tags: [Sources]
      operationId: createSourceUploadIntent
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, contentType, sizeBytes]
              properties:
                fileName: { type: string, maxLength: 200 }
                contentType: { type: string, const: application/pdf }
                sizeBytes: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Upload intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadIntentResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
  /v1/sources/{sourceId}:
    get:
      summary: Read source processing state
      tags: [Sources]
      operationId: getSource
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Source state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/uploads/sources/intake:
    post:
      summary: Intake a private PDF source upload
      tags: [Sources]
      operationId: intakeSourceUpload
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Upload accepted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [uploadId, status, byteSize, contentType, maxBytes]
                    properties:
                      uploadId: { type: string, format: uuid }
                      status: { type: string, enum: [received, verified, rejected, deleted] }
                      byteSize: { type: integer, minimum: 0 }
                      contentType: { type: string, const: application/pdf }
                      maxBytes: { type: integer, minimum: 0 }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/uploads/sources/{id}:
    get:
      summary: Read source upload metadata (redacted)
      tags: [Sources]
      operationId: getSourceUpload
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Upload metadata (redacted)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, tenantId, workspaceId, uploaderUserId, filenameRedacted, byteSize, status]
                    properties:
                      id: { type: string, format: uuid }
                      tenantId: { type: string, format: uuid }
                      workspaceId: { type: string, format: uuid }
                      uploaderUserId: { type: string, format: uuid }
                      filenameRedacted: { type: string }
                      contentType: { type: string }
                      byteSize: { type: integer }
                      pageCountHint: { type: [integer, 'null'] }
                      magicSignature: { type: ['string', 'null'] }
                      status: { type: string, enum: [received, verified, rejected, deleted] }
                      failureCode: { type: ['string', 'null'] }
                      createdAt: { type: string, format: date-time }
                      updatedAt: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/uploads/sources/{id}/verify:
    post:
      summary: Verify PDF magic bytes and size
      tags: [Sources]
      operationId: verifySourceUpload
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [uploadId, status, magicSignature]
                    properties:
                      uploadId: { type: string, format: uuid }
                      status: { type: string, enum: [verified, rejected, deleted] }
                      magicSignature: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/uploads/sources/{id}/access:
    post:
      summary: Get signed download intent
      tags: [Sources]
      operationId: getSourceAccess
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Signed download intent
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [uploadId, workspaceId, expiresAtEpochMs, signedUrlFingerprint]
                    properties:
                      uploadId: { type: string, format: uuid }
                      workspaceId: { type: string, format: uuid }
                      expiresAtEpochMs: { type: integer, minimum: 0 }
                      signedUrlFingerprint: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/uploads/sources/{id}/delete:
    post:
      summary: Delete a source upload (tombstone + audit)
      tags: [Sources]
      operationId: deleteSourceUpload
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Delete completed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [uploadId, status, bytesRemoved]
                    properties:
                      uploadId: { type: string, format: uuid }
                      status: { type: string, enum: [deleted] }
                      bytesRemoved: { type: boolean }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/workspaces/{workspaceId}/assessments:
    get:
      summary: List assessments in the active workspace
      tags: [Assessments]
      operationId: listAssessments
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Assessment page
          content:
            application/json:
              schema:
                type: object
                required: [assessments, count]
                properties:
                  assessments:
                    type: array
                    items: { $ref: "#/components/schemas/AssessmentSummary" }
                  count: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create an assessment draft and generation job
      tags: [Assessments]
      operationId: createAssessment
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssessmentRequest"
            examples:
              minimal:
                value:
                  title: Ulangan Harian Matematika
                  curriculumVersionId: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  gradeId: ""
                  subjectId: ""
                  sourceUploadIds: []
                  blueprintItems:
                    - sequence: 1
                      questionType: multiple_choice
                      difficulty: easy
      responses:
        "201":
          description: Draft and generation job created
          content:
            application/json:
              schema:
                type: object
                required: [assessment, version, blueprintItems, idempotent]
                properties:
                  assessment: { $ref: "#/components/schemas/AssessmentSummary" }
                  version:
                    type: object
                    additionalProperties: true
                  blueprintItems:
                    type: array
                    items: { $ref: "#/components/schemas/BlueprintSnapshotItem" }
                  idempotent: { type: boolean }
        "200":
          description: Idempotent replay returned the existing draft
          content:
            application/json:
              schema:
                type: object
                required: [assessment, version, blueprintItems, idempotent]
                properties:
                  assessment: { $ref: "#/components/schemas/AssessmentSummary" }
                  version:
                    type: object
                    additionalProperties: true
                  blueprintItems:
                    type: array
                    items: { $ref: "#/components/schemas/BlueprintSnapshotItem" }
                  idempotent: { type: boolean, enum: [true] }
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/workspaces/{workspaceId}/assessments/{assessmentId}:
    get:
      summary: Read an assessment
      tags: [Assessments]
      operationId: getAssessment
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/AssessmentId"
      responses:
        "200":
          description: Assessment detail (assessment + latest version + blueprint items)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workspaces/{workspaceId}/assessments/{assessmentId}/versions/{versionId}/blueprint:
    post:
      summary: Build or retrieve a validated blueprint for an assessment version
      tags: [Assessments]
      operationId: buildBlueprint
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/AssessmentId"
        - in: path
          name: versionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildBlueprintRequest"
      responses:
        "201":
          description: Blueprint built and snapshot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintPipelineResponse"
        "200":
          description: Cached blueprint snapshot returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintPipelineResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      summary: Retrieve the existing blueprint snapshot for an assessment version
      tags: [Assessments]
      operationId: getBlueprint
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/AssessmentId"
        - in: path
          name: versionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Blueprint snapshot
          content:
            application/json:
              schema:
                type: object
                required: [snapshot]
                properties:
                  snapshot:
                    $ref: "#/components/schemas/BlueprintSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/jobs/{jobId}:
    get:
      summary: Read asynchronous job state
      tags: [Jobs]
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Cancel a job
      tags: [Jobs]
      operationId: cancelJob
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job cancelled
          content:
